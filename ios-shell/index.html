<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minipiry · 超简到期</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui;background:#f6f1e7;color:#1c1a17;text-align:center;padding:24px;box-sizing:border-box}h1{font-size:22px;margin:0 0 8px}p{color:#6b645a;margin:0 0 24px;line-height:1.5}button{font:inherit;font-weight:600;padding:12px 28px;border:2px solid #1c1a17;background:#1c1a17;color:#f6f1e7}</style></head>
<body><main><h1 id="t">网络不可用</h1><p id="b">请检查网络连接后重试。</p><button id="r" onclick="location.href='https://minipiry.lovable.app'">重试</button></main>
<script>if(!/^zh/i.test(navigator.language)){t.textContent="You're offline";b.textContent="Check your connection and try again.";r.textContent="Retry";document.documentElement.lang="en"}
addEventListener("online",function(){location.href="https://minipiry.lovable.app"})</script></body></html>
